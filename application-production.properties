# Database configuration (replace with your actual values)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=bigwater
quarkus.datasource.password=YOUR_STRONG_PASSWORD_HERE
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bigwater_affiliate

# Connection pool settings
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=PT5S

# JPA/Hibernate configuration
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# HTTP configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.read-timeout=30s
quarkus.http.body.handle-file-uploads=true

# CORS configuration (adjust origins for your domain)
quarkus.http.cors=true
quarkus.http.cors.origins=https://yourdomain.com,https://www.yourdomain.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,cache-control
quarkus.http.cors.access-control-max-age=86400

# Security configuration
quarkus.http.auth.permission.permit1.paths=/q/*,/api/health,/api/affiliate/register
quarkus.http.auth.permission.permit1.policy=permit

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."com.bigwater".level=INFO
quarkus.log.category."org.hibernate".level=WARN

# Console logging in production
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# File logging
quarkus.log.file.enable=true
quarkus.log.file.path=/opt/bigwater/logs/application.log
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5

# Health check configuration
quarkus.smallrye-health.root-path=/q/health

# Metrics (optional)
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# Native image settings (if using native compilation)
quarkus.native.container-build=true

# OpenAPI/Swagger configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Cache configuration
quarkus.cache.caffeine.expire-after-write=PT10M

# Transaction timeout
quarkus.transaction-manager.default-transaction-timeout=PT30S

# Application info
quarkus.application.name=BigWater Affiliate API
quarkus.application.version=1.0.0