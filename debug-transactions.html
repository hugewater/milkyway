<!DOCTYPE html>
<html>
<head>
    <title>Debug Transactions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .transaction { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
        .hash { font-family: monospace; background: #f0f0f0; padding: 2px 4px; }
        .has-hash { color: blue; }
        .no-hash { color: gray; }
    </style>
</head>
<body>
    <h1>Debug Transactions</h1>
    <button onclick="loadTransactions()">Load Transactions</button>
    <div id="results"></div>
    
    <script>
        const mask = (v) => { 
            const s = String(v || ''); 
            if (s.length <= 6) return s; 
            return 'x'.repeat(s.length - 6) + s.slice(-6) 
        };
        
        async function loadTransactions() {
            try {
                const response = await fetch('/bw-api/transactions?limit=5');
                const data = await response.json();
                
                console.log('API Response:', data);
                
                const results = document.getElementById('results');
                results.innerHTML = '';
                
                if (data.data) {
                    data.data.forEach(transaction => {
                        const div = document.createElement('div');
                        div.className = 'transaction';
                        
                        const hasHash = transaction.transactionHash && transaction.transactionHash !== null;
                        const hashDisplay = hasHash ? mask(transaction.transactionHash) : '-';
                        const hashClass = hasHash ? 'has-hash' : 'no-hash';
                        
                        div.innerHTML = `
                            <h3>Transaction ID: ${transaction.id}</h3>
                            <p><strong>Raw transactionHash:</strong> ${JSON.stringify(transaction.transactionHash)}</p>
                            <p><strong>Has hash:</strong> ${hasHash}</p>
                            <p><strong>Display:</strong> <span class="hash ${hashClass}">${hashDisplay}</span></p>
                            <p><strong>Status:</strong> ${transaction.status}</p>
                            <p><strong>Description:</strong> ${transaction.description}</p>
                        `;
                        
                        results.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading transactions:', error);
                document.getElementById('results').innerHTML = '<p>Error loading transactions: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
